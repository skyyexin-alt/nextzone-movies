name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS via Native SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_IP" << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            TARGET_DIR=""
            for dir in /var/www/nextzone-movies /var/www/xflix-movies-review /var/www/nextzone /var/www/xflix; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find /var/www /root /home /opt -name ".git" 2>/dev/null | head -n 1 | xargs -r dirname)
            fi

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              echo "Deploying to target directory: $TARGET_DIR"
              cd "$TARGET_DIR"
              git fetch origin main
              git reset --hard origin/main
              npm install
              rm -rf .next
              npm run build
              
              if pm2 restart xflix-review 2>/dev/null; then
                echo "Restarted xflix-review process"
              elif pm2 restart nextzone 2>/dev/null; then
                echo "Restarted nextzone process"
              elif pm2 restart all 2>/dev/null; then
                echo "Restarted PM2 processes"
              else
                echo "Starting new xflix-review PM2 process..."
                pm2 start npm --name "xflix-review" -- start
              fi
              pm2 save
            else
              echo "Target directory not found!"
              exit 1
            fi
          EOF
