name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin
            echo "Searching for nextzone-movies git repos..."
            find /var/www /root /home /opt -name ".git" 2>/dev/null | while read -r gitdir; do
              repo_dir=$(dirname "$gitdir")
              echo "Checking repo in: $repo_dir"
              cd "$repo_dir" || continue
              if git remote get-url origin 2>/dev/null | grep -q "nextzone-movies"; then
                echo "FOUND MATCHING REPO in $repo_dir! Updating..."
                git fetch origin main
                git reset --hard origin/main
                npm install
                npm run build
                echo "Successfully built in $repo_dir"
              fi
            done
            pm2 restart all



