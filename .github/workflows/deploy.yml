name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment on Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script_stop: false
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "=================================================="
            echo "🚀 STARTING HETZNER VPS DEPLOYMENT FOR XFLIX"
            echo "=================================================="

            TARGET_DIR=""
            for d in $(find /var/www /root /home /opt -maxdepth 3 -name "package.json" 2>/dev/null | xargs -r dirname); do
              if [ -d "$d/.git" ]; then
                cd "$d"
                REMOTE=$(git config --get remote.origin.url 2>/dev/null || true)
                if [[ "$REMOTE" == *"XFlix-Movies-Review"* ]]; then
                  TARGET_DIR="$d"
                  break
                fi
              fi
            done

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              echo "--> Target project directory matched: $TARGET_DIR"
              cd "$TARGET_DIR"

              echo "--> Fetching & resetting to origin/main..."
              git config --global --add safe.directory "$TARGET_DIR" || true
              git checkout -f main || true
              git fetch origin main
              git reset --hard origin/main

              echo "--> Installing dependencies if needed..."
              npm install --legacy-peer-deps || npm install

              echo "--> Building production Next.js app..."
              npm run build

              echo "--> Reloading PM2 processes & Nginx..."
              pm2 reload all --update-env || pm2 restart all || pm2 start npm --name "xflix-review" -- start
              pm2 save || true
              systemctl reload nginx || systemctl restart nginx || true

              echo "=================================================="
              echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY!"
              echo "=================================================="
            else
              echo "❌ Error: Project directory not found on VPS!"
              exit 1
            fi
