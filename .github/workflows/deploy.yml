name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS via Native SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$SERVER_IP" << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "==== Searching and updating all matching repositories on Hetzner VPS ===="
            
            find /var/www /root /home /opt -name ".git" 2>/dev/null | while read -r gitdir; do
              repo_dir=$(dirname "$gitdir")
              echo "Checking repository: $repo_dir"
              cd "$repo_dir" || continue
              
              remote_url=$(git remote get-url origin 2>/dev/null || echo "")
              if echo "$remote_url" | grep -qE "nextzone-movies|xflix"; then
                echo "--> Updating repository in $repo_dir..."
                git fetch origin main
                git reset --hard origin/main
                npm install
                rm -rf .next
                npm run build
                echo "--> Successfully built in $repo_dir"
              fi
            done

            echo "==== Restarting PM2 processes and Nginx ===="
            pm2 restart all || pm2 reload all --update-env || true
            pm2 save || true
            systemctl reload nginx || systemctl restart nginx || true
            echo "==== Deployment Completed Successfully ===="
          EOF
