name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment on Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: false
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "=================================================="
            echo "🚀 STARTING HETZNER VPS DEPLOYMENT FOR XFLIX"
            echo "=================================================="

            echo "--> Step 1: Locating project repository directory..."
            TARGET_DIR=""
            for dir in /var/www/nextzone-movies /var/www/xflix-movies-review /var/www/nextzone /var/www/xflix; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find /var/www /root /home /opt -name ".git" 2>/dev/null | head -n 1 | xargs -r dirname)
            fi

            echo "--> Step 2: Target Directory Found: $TARGET_DIR"
            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              echo "--> Step 3: Fetching & resetting to latest main branch..."
              git fetch origin main
              git reset --hard origin/main
              
              echo "--> Step 4: Installing dependencies..."
              npm install
              
              echo "--> Step 5: Clearing cache & building production Next.js app..."
              rm -rf .next
              npm run build
              
              echo "--> Step 6: Restarting PM2 process..."
              pm2 restart all || pm2 reload all --update-env || pm2 start npm --name "xflix-review" -- start
              pm2 save || true
              
              echo "--> Step 7: Reloading Nginx web server..."
              systemctl reload nginx || systemctl restart nginx || true
              echo "=================================================="
              echo "🎉 DEPLOYMENT TO HETZNER COMPLETED SUCCESSFULLY!"
              echo "=================================================="
            else
              echo "❌ Error: Project directory not found on VPS!"
              exit 1
            fi
