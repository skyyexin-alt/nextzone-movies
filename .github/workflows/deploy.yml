name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hetzner VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            TARGET_DIR=""
            for dir in /var/www/nextzone-movies /var/www/xflix-movies-review /var/www/nextzone /var/www/xflix; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find /var/www /root /home /opt -name ".git" 2>/dev/null | head -n 1 | xargs -r dirname)
            fi

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              echo "Deploying to target directory: $TARGET_DIR"
              cd "$TARGET_DIR"
              git fetch origin main
              git reset --hard origin/main
              npm install
              rm -rf .next
              npm run build
              pm2 restart xflix-review || pm2 restart nextzone || pm2 restart all
            else
              echo "Target directory not found!"
              exit 1
            fi
