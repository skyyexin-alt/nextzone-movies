name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment on Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: false
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "=================================================="
            echo "🚀 STARTING HETZNER VPS DEPLOYMENT FOR XFLIX"
            echo "=================================================="

            DIRS=$(find /var/www /root /home /opt -name ".git" 2>/dev/null | xargs -r dirname)
            FOUND=0
            for d in $DIRS; do
              if [ -f "$d/package.json" ]; then
                echo "--> Found project directory at: $d"
                FOUND=1
                cd "$d"
                echo "--> Fetching & resetting $d to origin/main..."
                git config --global --add safe.directory "$d" || true
                git checkout -f main || true
                git fetch --all
                git reset --hard origin/main || git pull origin main --force
                
                echo "--> Installing dependencies in $d..."
                npm install --legacy-peer-deps || npm install
                
                echo "--> Building production Next.js app in $d (Isolated atomic build)..."
                rm -rf .next_temp
                NEXT_DIST_DIR=.next_temp npm run build
                
                echo "--> Performing atomic directory swap to .next..."
                rm -rf .next_old
                mv .next .next_old 2>/dev/null || true
                mv .next_temp .next
              fi
            done

            if [ "$FOUND" -eq 1 ]; then
              echo "--> Executing Zero-Downtime PM2 Reload..."
              pm2 reload all --update-env || pm2 restart all || pm2 start npm --name "xflix-review" -- start
              pm2 save || true
              rm -rf .next_old 2>/dev/null || true
              
              echo "--> Reloading Nginx web server..."
              systemctl reload nginx || systemctl restart nginx || true
              echo "=================================================="
              echo "🎉 DEPLOYMENT TO HETZNER COMPLETED SUCCESSFULLY!"
              echo "=================================================="
            else
              echo "❌ Error: Project directory not found on VPS!"
              exit 1
            fi
